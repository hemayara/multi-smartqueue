# Render.com Deployment Blueprint
# One-click deploy: https://render.com/deploy
# This file configures both backend + frontend on Render

services:
  # ── Backend API (Python + Flask + Socket.IO) ────────────────────────
  - type: web
    name: smartqueue-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGO_URI
        sync: false  # User must provide MongoDB Atlas URI
      - key: MONGO_DB_NAME
        value: smart_queue_db
      - key: FRONTEND_URL
        sync: false  # Set to your frontend URL after deployment
      - key: CORS_ORIGINS
        sync: false  # Set to your frontend URL after deployment
      - key: SOCKETIO_CORS_ALLOWED_ORIGINS
        sync: false  # Set to your frontend URL after deployment
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.7"

  # ── Frontend (React + Vite Static Site) ─────────────────────────────
  - type: web
    name: smartqueue-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false  # Set to your backend URL + /api (e.g., https://smartqueue-backend.onrender.com/api)
      - key: VITE_SOCKET_URL
        sync: false  # Set to your backend URL (e.g., https://smartqueue-backend.onrender.com)
